[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpe-bio"
version = "0.1.0"
description = "BPE tokenization experiments for protein and genome language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "tokenizers>=0.19",
    "transformers>=4.40",
    "torch>=2.2",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["bpe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
